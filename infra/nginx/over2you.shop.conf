server {
    listen 80;
    listen 443 ssl;
    server_name over2you.shop www.over2you.shop;

    ssl_certificate /etc/nginx/ssl/prepace.crt;
    ssl_certificate_key /etc/nginx/ssl/prepace.key;

    # CMS Admin & API
    location /admin {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
        client_max_body_size 50m;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
    }

    # Static site (v2)
    root /root/projects/over2you-v2/dist;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # cache static assets - shorter cache for dev, no immutable
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|webp)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # JSON data - no cache
    location ~* \.json$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
